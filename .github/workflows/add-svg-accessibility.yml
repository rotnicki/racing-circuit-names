name: Add SVG accessibility metadata

on:
  push:
    paths:
      - '.github/workflows/add-svg-accessibility.yml'

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add accessibility metadata to SVG files
        shell: python
        run: |
          from pathlib import Path

          items = [
              (
                  Path('assets/circuits/laguna-seca.svg'),
                  'laguna-seca-title',
                  'laguna-seca-desc',
                  'Schemat układu toru Laguna Seca',
                  'Schemat nitki toru wyścigowego Laguna Seca w Monterey County w Kalifornii, z oznaczeniami zakrętów i kierunku jazdy.'
              ),
              (
                  Path('assets/circuits/interlagos.svg'),
                  'interlagos-title',
                  'interlagos-desc',
                  'Schemat układu toru Interlagos',
                  'Schemat nitki toru Autódromo José Carlos Pace, powszechnie nazywanego Interlagos, w São Paulo w Brazylii.'
              ),
          ]

          for path, title_id, desc_id, title, desc in items:
              text = path.read_text(encoding='utf-8')
              if f'id="{title_id}"' in text:
                  continue

              start = text.find('<svg')
              if start == -1:
                  raise RuntimeError(f'No root svg element in {path}')
              end = text.find('>', start)
              if end == -1:
                  raise RuntimeError(f'Unclosed root svg element in {path}')

              root = text[start:end]
              root += f'\n   role="img"\n   aria-labelledby="{title_id} {desc_id}"'
              text = text[:start] + root + text[end:]

              end = text.find('>', start)
              accessibility = (
                  '\n  <!-- Accessibility metadata added 2026-08-16; geometry and visual appearance unchanged. -->'
                  f'\n  <title id="{title_id}">{title}</title>'
                  f'\n  <desc id="{desc_id}">{desc}</desc>'
              )
              text = text[:end + 1] + accessibility + text[end + 1:]
              path.write_text(text, encoding='utf-8')

      - name: Commit accessibility changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/circuits/laguna-seca.svg assets/circuits/interlagos.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add accessibility metadata to circuit SVG files'
          git push
