name: Import Spa-Francorchamps SVG

on:
  push:
    paths:
      - '.github/workflows/import-spa-francorchamps-svg.yml'

permissions:
  contents: write

jobs:
  import-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Download verified Wikimedia Commons mirror and add accessibility metadata
        run: |
          mkdir -p assets/circuits
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/FelixDubois/when_is_f1/main/assets/circuits/spa.svg' \
            -o assets/circuits/spa-francorchamps.svg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/circuits/spa-francorchamps.svg')
          s = p.read_text(encoding='utf-8')
          old = '<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"\n\t viewBox="0 0 550 443.7" style="enable-background:new 0 0 550 443.7;" xml:space="preserve">'
          new = '<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"\n\t viewBox="0 0 550 443.7" style="enable-background:new 0 0 550 443.7;" xml:space="preserve" role="img" aria-labelledby="spa-title spa-desc">\n<title id="spa-title">Schemat układu toru Circuit de Spa-Francorchamps</title>\n<desc id="spa-desc">Schemat współczesnego układu Grand Prix toru Circuit de Spa-Francorchamps w Belgii. Zaznaczono nitkę o długości 7,004 kilometra, numery 19 zakrętów, sektory, strefy DRS i punkt pomiaru prędkości.</desc>\n<!-- Accessibility metadata added 2026-08-16; geometry and visual appearance unchanged. -->'
          if old not in s:
              raise SystemExit('Expected SVG root not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/circuits/spa-francorchamps.svg
          git commit -m 'Add accessible Spa-Francorchamps circuit SVG'
          git push origin master
