name: Import Tor Poznan SVG

on:
  push:
    paths:
      - '.github/workflows/import-tor-poznan-svg.yml'

permissions:
  contents: write

jobs:
  import-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and add accessibility metadata
        run: |
          python - <<'PY'
          import pathlib
          import re
          import urllib.request

          url = 'https://upload.wikimedia.org/wikipedia/commons/f/f5/Pozna%C5%84_GP_layout.svg'
          target = pathlib.Path('assets/circuits/tor-poznan.svg')
          target.parent.mkdir(parents=True, exist_ok=True)

          req = urllib.request.Request(url, headers={'User-Agent': 'racing-circuit-names/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              svg = response.read().decode('utf-8')

          match = re.search(r'<svg\b[^>]*>', svg, flags=re.I | re.S)
          if not match:
              raise RuntimeError('Root SVG element not found')

          root = match.group(0)
          if 'role=' not in root:
              root = root[:-1] + ' role="img" aria-labelledby="tor-poznan-title tor-poznan-desc">'
          elif 'aria-labelledby=' not in root:
              root = root[:-1] + ' aria-labelledby="tor-poznan-title tor-poznan-desc">'

          metadata = (
              '\n<!-- Accessibility metadata added 2026-08-16; geometry and visual appearance unchanged. -->\n'
              '<title id="tor-poznan-title">Schemat układu Toru Poznań</title>\n'
              '<desc id="tor-poznan-desc">Schemat głównej nitki Toru Poznań w rejonie Ławicy i Przeźmierowa, przedstawiający tor samochodowy i motocyklowy o długości 4,083 km, prowadzony zgodnie z ruchem wskazówek zegara.</desc>\n'
          )

          svg = svg[:match.start()] + root + metadata + svg[match.end():]
          target.write_text(svg, encoding='utf-8')
          PY

      - name: Commit imported SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/circuits/tor-poznan.svg
          git commit -m "Add accessible Tor Poznan circuit SVG"
          git push
